<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPOS</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/aside.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">    
</head>
<body>
    <aside>
        <h1>SmartPOS</h1>
        <nav id="left-nav">
            <ul>
                <li>
                    <button>
                        <img src="#" alt="#">
                        <span>Dashboard</span>
                    </button>
                </li>
                <li>
                    <button>
                        <img src="#" alt="#">
                        <span>Food & drinks</span>
                    </button>
                </li>
                <li>
                    <button>
                        <img src="#" alt="#">
                        <span>Messages</span>
                    </button>
                </li>
                <li>
                    <button>
                        <img src="#" alt="#">
                        <span>Bills</span>
                    </button>
                </li>
                <li>
                    <button>
                        <img src="#" alt="#">
                        <span>Settings</span>
                    </button>
                </li>
                <br>
                <span>Other</span>
                <li>
                    <button>
                        <img src="#" alt="#">
                        <span>Notifications</span>
                    </button>
                </li>
                <li>
                    <button>
                        <img src="#" alt="#">
                        <span>Support</span>
                    </button>
                </li>
            </ul>
        </nav>

        <div id="cos-w-side-barze-na-dole-nie-wiem-co-to-jest">
            <div>
                <img src="#" alt="#">
                <span>Theresa Webb</span>
                <span>Waiter * 4h 56m</span>
                <button>Open Profile</button>
            </div>
        </div>
    </aside>
    <main>
        <div id="top">
            <button>
                <img src="#" alt="#">
                <span>Food & Drinks > </span><span>Burgers</span>
            </button>
            <div id="searchbar">
                <input type="text" placeholder="Search">
            </div>
        </div>
        <h1>Burgers</h1>
        <section>
            <div class="item">
                <img src="assets/cheeseburger.svg" alt="cheeseburger">
                <span class="item-name">Cheeseburger</span>
                <span class="item-weight">150g</span>
                <span class="item-price">$3.50</span>
            </div>
            <div class="item">
                <img src="assets/chicken-deluxe.svg" alt="chicken-deluxe">
                <span class="item-name">Chicken-Deluxe</span>
                <span class="item-weight">240g</span>
                <span class="item-price">$4.25</span>
            </div>
            <div class="item">
                <img src="assets/hamburger.svg" alt="hamburger">
                <span class="item-name">Hamburger</span>
                <span class="item-weight">320g</span>
                <span class="item-price">$4.50</span>
            </div>
            <div class="item">
                <img src="assets/big-john.svg" alt="big-john">
                <span class="item-name">Big John</span>
                <span class="item-weight">650g</span>
                <span class="item-price">$6.90</span>
            </div>
            <div class="item">
                <img src="assets/cheeseburger.svg" alt="cheeseburger">
                <span class="item-name">Cheeseburger</span>
                <span class="item-weight">150g</span>
                <span class="item-price">$3.50</span>
            </div>
            <div class="item">
                <img src="assets/cheeseburger.svg" alt="cheeseburger">
                <span class="item-name">Cheeseburger</span>
                <span class="item-weight">150g</span>
                <span class="item-price">$3.50</span>
            </div>
        </section>
    </main>
</body>
</html>
